[workspace]
members = [
    "account",
    "bencher",
    "cli",
    "error",
    "fuzz/*",
    "harness",
    "programs/*",
    "replay",
    "result",
]
exclude = ["test-programs"]
resolver = "2"

[workspace.package]
authors = ["Anza Technology Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/anza-xyz/mollusk"
readme = "README.md"
license-file = "LICENSE"
edition = "2021"
version = "0.17.1"

[workspace.dependencies]
agave-feature-set = "4.4.0"
agave-precompiles = "4.4.0"
agave-reserved-account-keys = "4.4.0"
agave-snapshots = "4.4.0"
bincode = "1.3.3"
bs58 = "0.5.1"
chrono = "0.4.44"
clap = "4.6.1"
criterion = "0.8.2"
hex = "0.4.3"
ed25519-dalek = "=2.1.1"
libsecp256k1 = "0.7.2"
mollusk-svm = { path = "harness", version = "0.17.1" }
mollusk-svm-account = { path = "account", version = "0.17.1" }
mollusk-svm-bencher = { path = "bencher", version = "0.17.1" }
mollusk-svm-cli = { path = "cli", version = "0.17.1" }
mollusk-svm-error = { path = "error", version = "0.17.1" }
mollusk-svm-fuzz-fixture = { path = "fuzz/fixture", version = "0.17.1" }
mollusk-svm-fuzz-fixture-firedancer = { path = "fuzz/fixture-fd", version = "0.17.1" }
mollusk-svm-fuzz-fs = { path = "fuzz/fs", version = "0.17.1" }
mollusk-svm-programs-memo = { path = "programs/memo", version = "0.17.1" }
mollusk-svm-replay = { path = "replay", version = "0.17.1" }
mollusk-svm-result = { path = "result", version = "0.17.1" }
mollusk-svm-programs-token = { path = "programs/token", version = "0.17.1" }
mollusk-svm-programs-token-2022 = { path = "programs/token-2022", version = "0.17.1" }
num-format = "0.4.4"
openssl = "0.10.78"
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"
rand0-7 = { package = "rand", version = "0.7" }
rayon = "1.12.0"
serde = "1.0.203"
serde_json = "1.0.150"
serde_yaml = "0.9.34"
serial_test = "2.0"
sha2 = "0.10.9"
solana-account = "5.0.0"
solana-account-info = "3.1.0"
solana-accounts-db = "4.4.0"
solana-bpf-loader-program = "4.4.0"
solana-clock = "4.0.0"
solana-compute-budget = "4.4.0"
solana-compute-budget-instruction = "4.4.0"
solana-compute-budget-program = "4.4.0"
solana-cpi = "3.1.0"
solana-ed25519-program = "3.0.0"
solana-entry = "4.4.0"
solana-epoch-rewards = "3.0.0"
solana-epoch-schedule = "3.0.0"
solana-fee-calculator = "3.1.0"
solana-genesis-config = "5.0.0"
solana-genesis-utils = "4.4.0"
solana-hash = "4.2.0"
solana-instruction = "4.0.0"
solana-instruction-error = { version = "3.0.0", features = ["serde"] }
solana-instructions-sysvar = "5.0.0"
solana-keccak-hasher = { version = "3.1.0", features = ["sha3"] }
solana-leader-schedule = "4.4.0"
solana-ledger = "4.4.0"
solana-loader-v3-interface = "9.0.0"
solana-logger = "3.0.0"
solana-message = "5.0.0"
solana-msg = "3.0.0"
solana-native-token = "3.0.0"
solana-precompile-error = "3.0.0"
solana-program-entrypoint = "3.1.1"
solana-program-error = "3.0.0"
solana-program-option = "3.1.0"
solana-program-pack = "3.1.0"
solana-program-runtime = "4.4.0"
solana-pubkey = "4.1.0"
solana-rent = "4.2.0"
solana-runtime = "4.4.0"
solana-sdk-ids = "3.1.0"
solana-secp256k1-program = "3.1.1"
solana-secp256r1-program = "3.0.0"
solana-shred-version = "3.0.1"
solana-signature = "3.5.2"
solana-slot-hashes = "4.0.0"
solana-stake-history = "2.0.0"
solana-stake-interface = { version = "5.0.0", features = ["serde"] }
solana-svm = "4.4.0"
solana-svm-callback = "4.4.0"
solana-svm-feature-set = "4.4.0"
solana-svm-log-collector = "4.4.0"
solana-svm-timings = "4.4.0"
solana-svm-transaction = "6.0.0"
solana-syscalls = "4.4.0"
solana-system-interface = "3.0"
solana-system-program = "4.4.0"
solana-system-transaction = "5.0.0"
solana-sysvar = "5.0.0"
solana-sysvar-id = "3.1.0"
solana-transaction = "5.0.0"
solana-transaction-context = "4.4.0"
solana-transaction-error = "4.0.0"
solana-transaction-status-client-types = "4.4.0"
solana-transaction-status = "4.4.0"
solana-unified-scheduler-pool = "4.4.0"
solana-vote-program = "4.4.0"
solana-zk-elgamal-proof-program = "4.4.0"
spl-associated-token-account-interface = "2.0.0"
spl-token-2022-interface = "3.1.0"
spl-token-group-interface = "0.7.2"
spl-token-interface = "3.0.0"
spl-token-metadata-interface = "1.0.0"
tar = "0.4.46"
thiserror = "2.0.17"
wincode = "0.6.1"
tokio = "1.54.1"
zstd = "0.14.4"

# `solana-ledger` is built against Anza's RocksDB fork, mirroring Agave's own
# workspace. Only the `ledger` feature of `mollusk-svm-replay` pulls it in.
[patch.crates-io]
librocksdb-sys = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
rocksdb = { git = "https://github.com/anza-xyz/rust-rocksdb", rev = "4dba80dfe9434e595a971f5b2985ff9ba4fb31e7" }
